name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Free disk for the ESP-IDF image (~14 GB unpacked)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Device build (unsigned; signing stays on the Mac)
        run: |
          docker run --rm -v "$PWD":/project -w /project "espressif/idf:$(cat IDF_VERSION)" idf.py build
          ls -l build/garage-homekit.bin
      - name: Emulator tests (throwaway key and setup code)
        run: tools/qemu-test.sh
